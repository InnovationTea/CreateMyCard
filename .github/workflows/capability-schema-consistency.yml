name: Capability Schema Consistency

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check registry and validator schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check capability schema synchronization
        run: python widget_service/scripts/sync_capability_schemas.py --check
