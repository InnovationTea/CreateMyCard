<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1840" viewBox="0 0 760 1840">
  <style>
    .bg{fill:#f5f7fb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.full{fill:#a6d8b4}.hero{fill:#bda6f2}.support{fill:#f4c781}.action{fill:#f29cab}.half{fill:#72cdd0}.wide{fill:#6fb1e8}.compact{fill:#aebbd0}.pad{fill:none;stroke:#334155;stroke-width:2;stroke-dasharray:6 4}.t{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172033}.s{font:600 12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#10213d;text-anchor:middle;dominant-baseline:middle}.n{font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#64748b}
  </style>
  <rect class="bg" width="760" height="1840"/>
  <text class="t" x="28" y="34" font-size="23">2×4 保留布局总览（每行 2 个）</text>
  <text class="n" x="28" y="57">统一画布 320×160；WideHalf 为 320×80；WideTwoHalfLayout 是两个 WideHalf 上下排列。</text>

  <g transform="translate(28 90)"><text class="t" y="-10">WideSingleFocusLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="wide" x="8" y="8" width="304" height="144" rx="10"/><text class="s" x="160" y="80">WideHero / WideFull</text></g>
  <g transform="translate(400 90)"><text class="t" y="-10">WideFullOnlyLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="full" x="8" y="8" width="304" height="144" rx="10"/><text class="s" x="160" y="80">WideFull</text></g>

  <g transform="translate(28 320)"><text class="t" y="-10">WideTwoFullLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="full" x="8" y="8" width="148" height="144" rx="10"/><rect class="full" x="164" y="8" width="148" height="144" rx="10"/><text class="s" x="82" y="80">Full</text><text class="s" x="238" y="80">Full</text></g>
  <g transform="translate(400 320)"><text class="t" y="-10">WideFullHeroActionLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="full" x="8" y="8" width="148" height="144" rx="10"/><rect class="hero" x="164" y="8" width="148" height="100" rx="10"/><rect class="action" x="164" y="116" width="148" height="36" rx="18"/><text class="s" x="82" y="80">Full</text><text class="s" x="238" y="56">Hero</text><text class="s" x="238" y="134">PillAction</text></g>

  <g transform="translate(28 550)"><text class="t" y="-10">WideHeroActionFullLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="hero" x="8" y="8" width="148" height="100" rx="10"/><rect class="action" x="8" y="116" width="148" height="36" rx="18"/><rect class="full" x="164" y="8" width="148" height="144" rx="10"/><text class="s" x="82" y="56">Hero</text><text class="s" x="82" y="134">PillAction</text><text class="s" x="238" y="80">Full</text></g>
  <g transform="translate(400 550)"><text class="t" y="-10">WideFullTwoCompactLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="full" x="8" y="8" width="148" height="144" rx="10"/><rect class="support" x="164" y="8" width="148" height="68" rx="10"/><rect class="support" x="164" y="84" width="148" height="68" rx="10"/><text class="s" x="82" y="80">Full</text><text class="s" x="238" y="42">Support</text><text class="s" x="238" y="118">Support</text></g>

  <g transform="translate(28 780)"><text class="t" y="-10">WideFourCompactLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="compact" x="8" y="8" width="148" height="68" rx="10"/><rect class="compact" x="164" y="8" width="148" height="68" rx="10"/><rect class="compact" x="8" y="84" width="148" height="68" rx="10"/><rect class="compact" x="164" y="84" width="148" height="68" rx="10"/><text class="s" x="82" y="42">Compact</text><text class="s" x="238" y="42">Compact</text><text class="s" x="82" y="118">Compact</text><text class="s" x="238" y="118">Compact</text></g>
  <g transform="translate(400 780)"><text class="t" y="-10">WideFullFourActionLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="full" x="8" y="8" width="148" height="144" rx="10"/><rect class="action" x="164" y="8" width="68" height="68" rx="14"/><rect class="action" x="244" y="8" width="68" height="68" rx="14"/><rect class="action" x="164" y="84" width="68" height="68" rx="14"/><rect class="action" x="244" y="84" width="68" height="68" rx="14"/><text class="s" x="82" y="80">Full</text><text class="s" x="198" y="42">Action</text><text class="s" x="278" y="42">Action</text><text class="s" x="198" y="118">Action</text><text class="s" x="278" y="118">Action</text></g>

  <g transform="translate(28 1010)"><text class="t" y="-10">WideTwoHalfLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="half" x="8" y="8" width="304" height="68" rx="10"/><rect class="half" x="8" y="84" width="304" height="68" rx="10"/><text class="s" x="160" y="42">WideHalf 320×80</text><text class="s" x="160" y="118">WideHalf 320×80</text></g>
  <g transform="translate(400 1010)"><text class="t" y="-10">WideHalfTwoCompactLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="half" x="8" y="8" width="304" height="68" rx="10"/><rect class="compact" x="8" y="84" width="148" height="68" rx="10"/><rect class="compact" x="164" y="84" width="148" height="68" rx="10"/><text class="s" x="160" y="42">WideHalf 320×80</text><text class="s" x="82" y="118">Compact</text><text class="s" x="238" y="118">Compact</text></g>

  <g transform="translate(28 1240)"><text class="t" y="-10">WideHalfCompactTwoLargeActionLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="half" x="8" y="8" width="304" height="68" rx="10"/><rect class="compact" x="8" y="84" width="148" height="68" rx="10"/><rect class="action" x="164" y="84" width="68" height="68" rx="14"/><rect class="action" x="244" y="84" width="68" height="68" rx="14"/><text class="s" x="160" y="42">WideHalf 320×80</text><text class="s" x="82" y="118">Compact</text><text class="s" x="198" y="118">Action</text><text class="s" x="278" y="118">Action</text></g>
  <g transform="translate(400 1240)"><text class="t" y="-10">WideHalfFourLargeActionLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="half" x="8" y="8" width="304" height="68" rx="10"/><rect class="action" x="8" y="84" width="68" height="68" rx="14"/><rect class="action" x="88" y="84" width="68" height="68" rx="14"/><rect class="action" x="164" y="84" width="68" height="68" rx="14"/><rect class="action" x="244" y="84" width="68" height="68" rx="14"/><text class="s" x="160" y="42">WideHalf 320×80</text><text class="s" x="42" y="118">Action</text><text class="s" x="122" y="118">Action</text><text class="s" x="198" y="118">Action</text><text class="s" x="278" y="118">Action</text></g>

  <g transform="translate(28 1470)"><text class="t" y="-10">WideTwoFocusActionLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="hero" x="8" y="8" width="148" height="100" rx="10"/><rect class="action" x="8" y="116" width="148" height="36" rx="18"/><rect class="hero" x="164" y="8" width="148" height="144" rx="10"/><text class="s" x="82" y="56">Hero</text><text class="s" x="82" y="134">PillAction</text><text class="s" x="238" y="80">Hero</text></g>
  <g transform="translate(400 1470)"><text class="t" y="-10">WideTwoHeroActionLayout@1</text><rect class="card" width="320" height="160" rx="14"/><rect class="hero" x="8" y="8" width="148" height="100" rx="10"/><rect class="action" x="8" y="116" width="148" height="36" rx="18"/><rect class="hero" x="164" y="8" width="148" height="100" rx="10"/><rect class="action" x="164" y="116" width="148" height="36" rx="18"/><text class="s" x="82" y="56">Hero</text><text class="s" x="82" y="134">PillAction</text><text class="s" x="238" y="56">Hero</text><text class="s" x="238" y="134">PillAction</text></g>

  <!-- dashed outlines mark layout-owned padding/content-safe areas -->
  <g class="pad" transform="translate(28 320)"><rect x="20" y="20" width="124" height="120" rx="6"/><rect x="176" y="20" width="124" height="120" rx="6"/></g>
  <g class="pad" transform="translate(400 320)"><rect x="176" y="20" width="124" height="120" rx="6"/></g>
  <g class="pad" transform="translate(28 550)"><rect x="20" y="20" width="124" height="120" rx="6"/><rect x="176" y="20" width="124" height="120" rx="6"/></g>
  <g class="pad" transform="translate(400 550)"><rect x="176" y="8" width="124" height="68" rx="6"/><rect x="176" y="84" width="124" height="68" rx="6"/></g>
  <g class="pad" transform="translate(28 780)"><rect x="20" y="8" width="124" height="68" rx="6"/><rect x="176" y="8" width="124" height="68" rx="6"/><rect x="20" y="84" width="124" height="68" rx="6"/><rect x="176" y="84" width="124" height="68" rx="6"/></g>
  <g class="pad" transform="translate(400 1010)"><rect x="20" y="84" width="124" height="68" rx="6"/><rect x="176" y="84" width="124" height="68" rx="6"/></g>
  <g class="pad" transform="translate(28 1240)"><rect x="20" y="84" width="124" height="68" rx="6"/></g>
  <g class="pad" transform="translate(28 1470)"><rect x="20" y="20" width="124" height="120" rx="6"/><rect x="176" y="20" width="124" height="120" rx="6"/></g>
  <g class="pad" transform="translate(400 1470)"><rect x="20" y="20" width="124" height="120" rx="6"/><rect x="176" y="20" width="124" height="120" rx="6"/></g>
  <text class="n" x="28" y="1710">图例：Full/WideFull（绿）、Hero（紫）、Support/Compact（黄/灰）、Action（粉）、WideHalf（青）。仅表达槽位关系与尺寸。</text>
  <text class="n" x="28" y="1734">虚线 = 布局模板提供的 padding 内容安全区；没有虚线的槽位表示布局未额外提供 padding。</text>
</svg>
