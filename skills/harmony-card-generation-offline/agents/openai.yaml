interface:
  display_name: "Harmony Form 卡片生成（表达式）"
  short_description: "只用完整表达式读取 DataModel，生成 HarmonyOS Form 卡片。"
  default_prompt: "使用 $harmony-card-generation-offline 根据一句话生成 HarmonyOS A2UI Form 服务卡片；未指定尺寸时优先选择能满足核心需求的 2x2，只有 2x2 明确无法承载核心内容时才使用 2x4；动态值只使用完整 {{ ... }} 表达式，遵循硬规则和可验证模板骨架，最后只输出 genui 和 cardspec 代码块。"
