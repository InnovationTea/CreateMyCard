interface:
  display_name: "Harmony 卡片云侧编排"
  short_description: "判断需求适配、能力满足度与数据权限，编排云侧插件创建或编辑 HarmonyOS 服务卡片。"
  default_prompt: "使用 $harmony-card-generation-online 创建或编辑 HarmonyOS 服务卡片；在卡片上下文中先判断需求适配和能力满足度，无法满足时提前结束并给出安全的相近场景，部分满足时先说明再自动生成；未指定尺寸时优先选择能满足核心需求的 2x2，非空数据能力集合仅在权限明确通过后生成，返回 nonAuthStatus 时按 name 与 settingsPath 引导用户手动授权；编辑未指定目标时使用最近一次卡片结果，并严格根据真实状态和 artifactUrl 回复。"
