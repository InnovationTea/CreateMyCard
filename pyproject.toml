[project]
name = "create-my-card-debug-tools"
version = "0.1.0"
description = "Local debugging tools for the AI widget card service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "json5>=0.17.3",
    "widget-service",
]

[project.scripts]
debug_tools = "debug_tools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debug_tools"]
artifacts = [
    "debug_tools/a2ui_render/**",
    "!debug_tools/a2ui_render/.hvigor/**",
    "!debug_tools/a2ui_render/.preview/**",
    "!debug_tools/a2ui_render/node_modules/**",
    "!debug_tools/a2ui_render/oh_modules/**",
    "!debug_tools/a2ui_render/test-output/**",
    "!debug_tools/a2ui_render/**/.test/**",
    "!debug_tools/a2ui_render/**/build/**",
    "!debug_tools/a2ui_render/local.properties",
]
exclude = [
    "debug_tools/tests/**",
    "debug_tools/a2ui_render/.hvigor/**",
    "debug_tools/a2ui_render/.preview/**",
    "debug_tools/a2ui_render/node_modules/**",
    "debug_tools/a2ui_render/oh_modules/**",
    "debug_tools/a2ui_render/test-output/**",
    "debug_tools/a2ui_render/**/.test/**",
    "debug_tools/a2ui_render/**/build/**",
    "debug_tools/a2ui_render/local.properties",
]

[tool.uv.sources]
widget-service = { path = "widget_service", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["debug_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP009"]

[tool.pytest.ini_options]
testpaths = ["debug_tools/tests/python", "widget_service/tests"]
pythonpath = ["widget_service/cloud", "widget_service", "."]
