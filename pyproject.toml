[project]
name = "create-my-card-debug-tools"
version = "0.1.0"
description = "Local debugging tools for the AI widget card service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "widget-service",
]

[project.scripts]
debug_tools = "debug_tools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debug_tools"]

[tool.uv.sources]
widget-service = { path = "widget_service", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["debug_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP009"]
