<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="{{BASE_HREF}}">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #6b7685;
      font-family: "HarmonyOS Sans SC", "HarmonyOS Sans", -apple-system,
        BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #root { width: fit-content; height: fit-content; line-height: 0; }
    #preview-error {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: #6b1111;
      color: #fff;
      white-space: pre-wrap;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
  <script>
    window.__showCardError = function (message) {
      var element = document.getElementById("preview-error");
      if (!element) return;
      element.hidden = false;
      element.textContent = String(message || "Unknown preview error");
    };
  </script>
  <script
    src="https://unpkg.com/react@18/umd/react.production.min.js"
    crossorigin
    onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'"
  ></script>
  <script
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    crossorigin
    onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js'"
  ></script>
  <script
    src="https://unpkg.com/@babel/standalone@7/babel.min.js"
    crossorigin
    onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js'"
  ></script>
</head>
<body>
  <div id="root"></div>
  <pre id="preview-error" hidden></pre>
  <script>
    window.addEventListener("error", function (event) {
      window.__showCardError(
        (event.message || "Script error") +
          (event.filename
            ? "\n" + event.filename + ":" + event.lineno + ":" + event.colno
            : "")
      );
    });
    window.addEventListener("unhandledrejection", function (event) {
      var reason = event.reason;
      window.__showCardError(reason && (reason.stack || reason.message) || reason);
    });
    Babel.registerPlugin("strip-compiler-metadata", function () {
      return {
        visitor: {
          JSXAttribute: function (path) {
            if (path.node.name && path.node.name.name === "dataValueMaps") {
              path.remove();
            }
          }
        }
      };
    });
  </script>
  <script type="text/babel" data-presets="env,react" data-plugins="strip-compiler-metadata">
{{DESIGN_SYSTEM_RUNTIME}}

    const {
      Card,
      Stack,
      Grid,
      SingleLineTitle,
      DoubleLineTitle,
      Badge,
      DataDisplay,
      InfoBlock,
      TopTextBottomValue,
      TableText,
      TextBlock,
      EmphasizedData,
      EmphasisText,
      SecondaryBody,
      Summary,
      ProgressLine1,
      ProgressLine2,
      ProgressCircleSingle,
      ProgressCircle,
      NumericRatio,
      NumericRatioStack,
      ChecklistItem,
      EventCard,
      H_BarChart,
      Gauge,
      PillButton,
      CircleButton,
      CardButton,
    } = window.ClawWidgetDesignSystem;

    // === BEGIN GENERATED CARD ===
    function GeneratedCard() {
      return null;
    }
    // === END GENERATED CARD ===

    function App() {
      return <GeneratedCard />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    document.documentElement.dataset.generatedCard = "mounted";
  </script>
</body>
</html>
