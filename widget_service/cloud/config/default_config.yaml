# 蓝区默认配置。绿区 spec 配置存在时，只读取 spec，不与本文件合并。
ENVIRONMENT: local

# 每日成功次数：通过内部 API 查询及记录；绿区 spec 未配置时同样默认关闭。
enable_daily_usage_limit: false
daily_usage_limit: 20
# 用户 ID 的 SHA-256 十六进制摘要白名单，英文逗号分隔；命中后不限制、不查询及记录次数。
daily_usage_uid_whitelist: ""
# 用户可见话术；服务端另行补充要求主 Agent 回复该话术并停止本轮自动调用。
daily_usage_limit_exceeded_message: 今日 AI 卡片生成次数已达上限，请明天再尝试。
daily_usage_limit_unavailable_message: 本次卡片生成失败，请稍后重试。
# 每日次数 API 独立地址，包含协议、域名及可选端口；开启前必须填写。
daily_usage_slb: ""
# 以下路径从域名根目录开始。
daily_usage_api_snapshot_path: /genui-agent/v1/daily-usage/snapshot
daily_usage_api_record_path: /genui-agent/v1/daily-usage/record-success
daily_usage_api_timeout_seconds: 3.0
enable_photo_background_theme: true
enable_subjectless_wide_theme: false
enable_square_music_photo_expansion: false
enable_square_photo_expansion: false

hag_slb_url: ""
osms_prepare_url: ""
osms_complete_url: ""
osms_query_url: ""
osms_delete_url: ""
hag_osms_ak: ""
ids_query_url: "http://{{ip}}:{{port}}/hiai/ids/databus/v1/kvcommondata/query"
ids_access_key: "23232323232"
sts_serverDomain: ""
obs.use.edge: false
obs.expire.time: 3600
# 模型使用原始 src；转换成标准 A2UI 后按本映射替换，未命中保留原路径。
asset.src.url.mapping: ""
workspace_root: "D:/WorkSpace/CreateMyCard/widget_service/cloud"

enable_artifact_validation: false
enable_a2ui_model_mock: true
enable_ids_mock: true
ai_widget_data_huashan_enable: false
enable_default_capability_registry_fallback: true
enable_default_protocol_profile_fallback: true
enable_validation_failure_retry: true
# 融合实际修满5次仍失败后才可单步兜底；独立默认关闭，不改变原修复策略。
enable_single_step_generation_fallback: false
# 二次编辑默认走单步；关闭此项恢复原编辑路由，关闭总开关拒绝所有编辑。
enable_single_step_widget_edit: true
enable_widget_edit: true
# Repair 后是否继续严格校验 Plan 展示事实；动作覆盖始终校验。
enable_drop_plan_fact_validation: false
# 静态内容只向预检通过且没有动态候选的普通 Fusion 创建开放。
enable_static_content_generation_policy: true
static_content_max_input_chars: 16000
static_content_max_source_chars: 2000
static_content_max_source_references: 72
static_content_max_source_positions: 512
static_content_max_output_chars: 32000
enable_artifact_download_mock: true
enable_widget_directive_commands: false
enable_compact_dsl_argument_repair_fallback: false
compact_dsl_argument_repair_reminder_count: 1
compact_dsl_argument_repair_max_attempts: 2
# 参数兜底、归一化及请求校验完成后，仅对 Compact DSL 生成流程进行接口级重试。
enable_compact_dsl_interface_retry: true
# 是否在 Design Compact 的 DSL 生成阶段加载同尺寸 Few-shot；Plan 阶段始终不加载。
enable_design_compact_few_shots: true
# 默认关闭；开启后在 Plan 之后按布局、信息密度、必要动作和组件候选检索最多 4 例。
enable_design_compact_few_shot_selection: false
# 是否向 Plan 与 DSL 模型提示词追加由布局合同和视觉 Recipe 生成的运行时容量摘要。
enable_design_compact_runtime_prompt_context: false
# 2x4 校验失败后先尝试无损确定性紧凑候选，再沿用模型修复。
enable_design_compact_deterministic_repair: true
# 首次生成之外的额外重试次数；0 不重试，1 表示最多执行两次生成。必须为非负整数。
compact_dsl_interface_retry_count: 1
enable_openai_fallback: true
enable_sensitive_log_fields: true
enable_generation_trace_recording: false
generation_trace_root: workspace/traces
enable_card_template: false
enable_jsx_generation: false
fusion_ball_min_prd_version: 11.7.5.206

