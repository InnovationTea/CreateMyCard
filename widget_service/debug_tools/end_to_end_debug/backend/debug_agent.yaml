skill_root: skills
auto_discover_profiles: true
default_profile: harmony-card-generation-online
system_prompt: debug_tools/end_to_end_debug/backend/system_prompt.md
ui:
  quick_prompts:
    - label: 天气卡片
      prompt: 帮我做一个今天的天气卡片，显示上海市天气
    - label: 待办清单
      prompt: 创建一个待办清单卡片
    - label: 日程安排
      prompt: 创建一个日程卡片，显示最近的日程
    - label: 日程安排跳转
      prompt: 创建一个日程卡片，显示最近的日程，并且能够跳转查看
    - label: 拨打电话
      prompt: 创建一个天气卡片，显示今天的天气，并且可以点击给父亲打电话
profiles:
  harmony-card-generation-online:
    name: harmony-card-generation-online
    display_name: 在线卡片生成
    description: 当前在线云侧编排 Skill
# Main Agent 模型配置。优先级：default_config.yaml < 本节 < widget_service/.env。
# 实际传输只由 openai_master_client / WIDGET_SERVICE_OPENAI_MASTER_CLIENT 选择。
model:
  design_compact_model_backend: openai
  openai_master_client: llmclient
  openai_fallback_client: llmclient
  enable_model_failure_retry: false
  enable_openai_fallback: false
  model_failure_max_retry_attempts: 1
  fallback_model_failure_max_retry_attempts: 1
  model_failure_retry_initial_delay_seconds: 1.0
  model_failure_retry_max_delay_seconds: 30.0
  model_failure_retry_backoff_multiplier: 2.0
  model_failure_retry_jitter_ratio: 0.2
  model_max_concurrency: 20
  model_queue_timeout_seconds: 120
  model_request_timeout_seconds: 120
  deepseek_official_http_url: https://api.deepseek.com/chat/completions
  deepseek_official_http_api_key: ""
  deepseek_official_http_model: deepseek-flash
  deepseek_official_http_temperature: 0.7
  deepseek_official_http_top_p: 0.9
  deepseek_official_http_max_tokens: 8192
  deepseek_official_http_enable_thinking: false
  deepseek_platform_access_key: ""
  deepseek_platform_secret_key_sts_config_key: genui.deepseek.platform.secret.key
  deepseek_platform_ws_url: ""
  deepseek_platform_api_key: AccessService
  deepseek_platform_sender: superagent
  deepseek_platform_model_select: false
  deepseek_platform_model_name: AGENT-DEEPSEEK-V4-FLASH

# 批量测试的稳定运行参数。创建任务页面不提供这些字段，所有任务直接复用本节配置。
# 本地受管微服务始终在回环地址上使用运行时分配的空闲端口。
batch_testing:
  concurrency: 4
  max_retries: 1
  request_timeout_seconds: 300
  service_startup_timeout_seconds: 30
  enable_generation_trace_recording: true
  trace_root: workspace/traces
  enable_a2ui_model_mock: true
  enable_validation_failure_retry: false
  validation_failure_max_repair_attempts: 1
  enable_compact_dsl_interface_retry: false
  compact_dsl_interface_retry_count: 1
  enable_artifact_validation: true
  enable_artifact_download_mock: true
server:
  host: 127.0.0.1
  port: 8888
  upstream_base_url: ws://127.0.0.1:8855
  bundle_name: com.omega_w_0823.hmservice
  max_steps: 20
  max_tokens: 8192
  request_timeout_seconds: 180
  skill_resource_max_bytes: 262144
# 批跑真机截图仅由调试平台读取，不进入微服务配置或任务快照。
# 未指定 device_sn 时必须且只能连接一台 HDC 设备。
device_capture:
  hdc: D:/ENV/DevEco Studio/sdk/default/openharmony/toolchains/hdc.exe
  device_sn: null
  render_project: D:/WorkSpace/A2UI_Render_0916/A2UI_Render_0716
  deveco_sdk_home: D:/ENV/DevEco Studio/sdk
  java_home: D:/ENV/DevEco Studio/jbr
  hvigor: D:/ENV/DevEco Studio/tools/hvigor/bin/hvigorw.bat
  signed_hap_name: entry-default-unsigned.hap
  bundle_name: com.example.myapplication
  ability_name: EntryAbility
  module_name: entry
  rawfile_target: entry/src/main/resources/rawfile/test.json
  hap_output_dir: entry/build/default/outputs/default
  render_wait_seconds: 8
  command_timeout_seconds: 300
  crop_config: debug_tools/postprocess_plugins/device_capture/device_crop.json
  auto_start_emulator: true
  emulator: D:/ENV/DevEco Studio/tools/emulator/Emulator.exe
  emulator_name: Huawei_WideFold
  emulator_instance_root: D:/ENV/HuaweiEmulator
  emulator_image_root: D:/ENV/HuaweiSdk
  emulator_start_timeout_seconds: 120
  emulator_poll_seconds: 2
defaults:
  uid: debug-user
  device_id: debug-device
  phone_type: ALN-AL00
  app_version: 11.7.7.332
  rom_version: ALN-AL00 7.0.0.100
  locale: zh-CN
  country_code: CN
logging:
  level: INFO
  trace: false
  value_limit: 160
