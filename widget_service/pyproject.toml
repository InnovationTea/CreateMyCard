[project]
name = "widget-service"
version = "0.1.0"
description = "AI widget card generation microservice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "requests>=2.32.0",
    "orjson>=3.10.0",
    "jsonschema>=4.23.0",
    "packaging>=24.1",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "loguru>=0.7.0",
    "psutil>=6.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloud"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["cloud", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cloud"]
